# A standalone extension is NOT a pnpm workspace, and this file is not here to make it one. It exists for a
# single reason: pnpm 11 refuses to run a dependency's install script until that dependency is approved BY NAME,
# and the ones below have install scripts the build genuinely needs.
#
#   esbuild   — vite's bundler. Its postinstall puts the platform binary in place; without it `pnpm build` dies
#               on a missing binary, which reads like a broken repo rather than an unapproved script.
#   vue-demi  — the Vue 2/3 shim under @tanstack/vue-query. Its postinstall picks which Vue it targets.
#
# `true` rather than the placeholder pnpm writes ("set this to true or false"): that placeholder is a string,
# not a boolean, so it approves nothing and pnpm goes on ignoring the script silently.
allowBuilds:
  esbuild: true
  vue-demi: true

# TRANSIENT — safe to delete once @intentic/extension-ui@1.176.3 is a day old, and meaningless after that.
#
# pnpm 11.21 refuses any package published in the last 24 hours: a supply-chain measure against a compromised
# release being pulled in the minutes after it lands. That version is the kit's FIRST EVER publish and this repo
# depends on it, so for one day the hold blocks a clean `pnpm install` — and every script with it, since 11.21
# re-verifies the lockfile before running one. Naming the exact version waives the hold for that single release
# and nothing else; the policy stays on for everything.
minimumReleaseAgeExclude:
  - '@intentic/extension-ui@1.176.3'
